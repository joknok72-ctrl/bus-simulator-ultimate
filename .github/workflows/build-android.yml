name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_TAG: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'

      - name: Download Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -e
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_TAG}_linux.x86_64 godot
          chmod +x godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ./godot --version

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Configure Godot editor settings (Android SDK / JDK / keystore)
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.7.tres editor_settings-4.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: Import project
        run: |
          ~/godot/godot --headless --path . --import 2>&1 | tail -5 || true

      - name: Export Android APK (debug-signed, installable)
        run: |
          mkdir -p build
          ~/godot/godot --headless --path . --export-debug "Android" build/BusSimulatorUltimate.apk 2>&1 | tee export.log
          ls -la build/
          test -f build/BusSimulatorUltimate.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusSimulatorUltimate-apk
          path: build/BusSimulatorUltimate.apk

      - name: Publish GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bus Simulator Ultimate — أحدث نسخة APK"
          body: |
            🚌 **Bus Simulator Ultimate** — بناء تلقائي من الـ commit `${{ github.sha }}`
            المحرك: Godot ${{ env.GODOT_VERSION }}-stable

            📲 نزّل `BusSimulatorUltimate.apk` على هاتفك الأندرويد وثبّته (فعّل "تثبيت من مصادر غير معروفة").
          files: build/BusSimulatorUltimate.apk
          prerelease: false
          make_latest: true
